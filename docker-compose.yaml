services:
  backend:
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      MEDIA_MASTER_KEY: ${MEDIA_MASTER_KEY}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN}
      # H2 by default. For Postgres: `docker compose --profile postgres up` with
      # SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/iris and POSTGRES_PASSWORD set.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:file:/app/data/iris;AUTO_SERVER=TRUE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      # Android push: put the Firebase service-account JSON at
      # backend/secrets/firebase-service-account.json and set
      # FIREBASE_CREDENTIALS_FILE=/app/secrets/firebase-service-account.json
      FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    volumes:
      - ./backend/data:/app/data
      - ./backend/secrets:/app/secrets:ro

  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: iris
      # Shares the backend's credentials; the image refuses to start with an empty password.
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-sa}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
    volumes:
      - iris-pgdata:/var/lib/postgresql/data
    # no host port: only reachable from the backend on the compose network

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  iris-data:
  iris-pgdata:
