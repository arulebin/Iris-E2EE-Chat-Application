plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.iris.chat.mobile.keystore'
version = '0.1.0'

android {
  namespace "expo.modules.iriskeystore"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.biometric:biometric:1.1.0"
}
