spring.application.name=iris

# --- H2 database (file-based, so data survives server restarts) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/iris;AUTO_SERVER=TRUE}
# Driver is inferred from the URL, so pointing SPRING_DATASOURCE_URL at
# jdbc:postgresql://... switches to Postgres with no other config change.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# --- H2 web console (dev only: off unless H2_CONSOLE_ENABLED=true, never remote) ---
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

logging.level.org.springframework.security=INFO
# --- VAPID (web push identity) ---

vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT:mailto}

# --- Media (server-side encryption at rest for photos/videos) ---
media.master-key=${MEDIA_MASTER_KEY}
media.storage-dir=${MEDIA_STORAGE_DIR:./data/media}

# --- Cloudflare TURN Credentials ---
cloudflare.turn.key-id=${CLOUDFLARE_TURN_KEY_ID:}
cloudflare.turn.api-token=${CLOUDFLARE_TURN_API_TOKEN:}

# 50 MB cap per upload (matches the frontend's enforcement)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
